name: nuget

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/FacetedFilter/FacetedFilter.csproj

      - name: Pack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="0.1.0-preview.${GITHUB_RUN_NUMBER}"
          fi

          dotnet pack src/FacetedFilter/FacetedFilter.csproj             --configuration Release             --no-restore             -p:PackageVersion="$VERSION"             -o artifacts/nuget

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
